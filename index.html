<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahul — ASCII</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#0070f3;
    --line:#d8e8ff;
    --tag-bg:#f0f7ff;
    --tag-ink:#0056b3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}

  header{
    display:flex;align-items:center;justify-content:flex-end;
    gap:12px;
    padding:22px 40px;
    border-bottom:1px solid var(--line);
  }
  .btn-signin{
    padding:10px 22px;
    border:1px solid #b8d5ff;
    border-radius:8px;
    background:#fff;
    font-size:15px;
    font-weight:600;
    color:#0070f3;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .btn-signin:hover{background:#f0f7ff;}
  .btn-gh{
    width:44px;height:44px;
    border-radius:8px;
    background:#0070f3;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform 0.2s ease;
  }
  .btn-gh:hover{transform:scale(1.05);}
  .btn-gh svg{width:22px;height:22px;fill:#fff;}

  main{
    position:relative;
    max-width:1100px;
    margin:80px auto 100px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ascii-wrap{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
  }

  #ascii{
    font-family:"SF Mono","JetBrains Mono",Consolas,Menlo,monospace;
    font-size:6px;
    line-height:6.6px;
    letter-spacing:0;
    white-space:pre;
    color:#0070f3;
    user-select:none;
    -webkit-font-smoothing:none;
  }

  .tag{
    position:absolute;
    padding:8px 16px;
    background:var(--tag-bg);
    color:var(--tag-ink);
    border:1px solid #cce0ff;
    border-radius:20px;
    font-size:14px;
    font-weight:600;
    letter-spacing:.2px;
    box-shadow:0 2px 8px rgba(0,112,243,.12);
    white-space:nowrap;
  }
  .tag-left{ left:-2%; top:60%; }
  .tag-right{ right:-2%; top:34%; }
  .tag-bottom{ left:50%; bottom:-4%; transform:translateX(-50%); }

  @media (max-width:720px){
    #ascii{font-size:2.9px; line-height:3.3px;}
    .tag{font-size:11px; padding:6px 12px;}
    .tag-left{left:0;}
    .tag-right{right:0;}
  }
</style>
</head>

<script>
(function(){
  const OUT = 460;
  const canvas = document.getElementById('src');
  canvas.width = OUT; canvas.height = OUT;
  const ctx = canvas.getContext('2d');
  const img = document.getElementById('photo');
  const asciiEl = document.getElementById('ascii');

  const ramp = [' ', '.', ':', '-', '=', '+', '*', '#', '%', '@'];
  const cellW = 3, cellH = 6;
  const cols = Math.floor(OUT / cellW);
  const rows = Math.floor(OUT / cellH);

  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function drawBase(){
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const side = Math.min(iw, ih);
    const sx = (iw - side) / 2, sy = (ih - side) / 2;
    ctx.clearRect(0,0,OUT,OUT);
    ctx.save();
    ctx.beginPath();
    ctx.arc(OUT/2, OUT/2, OUT/2 - 2, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(img, sx, sy, side, side, 0, 0, OUT, OUT);
    ctx.restore();
  }

  function frame(t){
    drawBase();

    ctx.save();
    ctx.beginPath();
    ctx.arc(OUT/2, OUT/2, OUT/2 - 2, 0, Math.PI*2);
    ctx.clip();
    const sweepX = OUT/2 + Math.cos(t) * OUT*0.55;
    const sweepY = OUT/2 + Math.sin(t*0.7) * OUT*0.35;
    const glow = ctx.createRadialGradient(sweepX, sweepY, 10, sweepX, sweepY, OUT*0.7);
    glow.addColorStop(0, 'rgba(0,112,243,0.4)');
    glow.addColorStop(1, 'rgba(0,112,243,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,OUT,OUT);

    const shade = ctx.createRadialGradient(OUT-sweepX, OUT-sweepY, 10, OUT-sweepX, OUT-sweepY, OUT*0.7);
    shade.addColorStop(0, 'rgba(0,30,80,0.25)');
    shade.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shade;
    ctx.fillRect(0,0,OUT,OUT);
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(OUT/2, OUT/2, OUT/2 - 2, 0, Math.PI*2);
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(0,112,243,0.45)';
    ctx.stroke();
    ctx.restore();

    const data = ctx.getImageData(0,0,OUT,OUT).data;
    let out = '';
    for(let row=0; row<rows; row++){
      let line = '';
      for(let col=0; col<cols; col++){
        const px = col*cellW + (cellW>>1);
        const py = row*cellH + (cellH>>1);
        const idx = (py*OUT + px)*4;
        const a = data[idx+3];
        if (a < 10) { line += ' '; continue; }
        const rr = data[idx], gg = data[idx+1], bb = data[idx+2];
        const brightness = (rr+gg+bb)/3/255;
        if (brightness > 0.97) {
          line += ' ';
        } else {
          const rampIdx = Math.min(ramp.length-1, Math.floor((1-brightness) * ramp.length));
          line += ramp[rampIdx];
        }
      }
      out += line + '\n';
    }
    asciiEl.textContent = out;
  }

  function start(){
    if (prefersReduced) { frame(0.7); return; }
    let t = 0;
    frame(t);
    setInterval(function(){
      t += 0.09;
      frame(t);
    }, 90);
  }

  if (img.complete) start();
  else img.onload = start;
})();
</script>
