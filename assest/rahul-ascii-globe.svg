<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%">
  <defs>
    <!-- Circular Clip Path for Portrait -->
    <clipPath id="circleMask">
      <circle cx="450" cy="280" r="230"/>
    </clipPath>

    <style>
      .bg-rect {
        fill: #ffffff;
      }
      .ascii-code {
        font-family: 'SF Mono', 'JetBrains Mono', Consolas, Menlo, monospace;
        font-size: 5.2px;
        fill: #111111;
        white-space: pre;
        letter-spacing: 0px;
        user-select: none;
        -webkit-font-smoothing: none;
      }
      .tag-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #222222;
        letter-spacing: .2px;
      }
      .tag-box {
        fill: #f2f2f2;
        stroke: #e0e0e0;
        stroke-width: 1;
        rx: 18;
        ry: 18;
        filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.08));
      }
    </style>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" class="bg-rect" rx="16" />

  <!-- ENTIRE GLOBE MOVES UP AND DOWN (Nothing moving inside) -->
  <g id="movable-globe">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-14; 0,0"
      dur="4.5s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" keyTimes="0; 0.5; 1" />
      
    <!-- Globe Circle Background with Soft Ambient Shadow -->
    <circle cx="450" cy="280" r="230" fill="#ffffff" stroke="#e6e6e6" stroke-width="1.5" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.07))"/>

    <!-- High Clarity Face ASCII Portrait inside Globe -->
