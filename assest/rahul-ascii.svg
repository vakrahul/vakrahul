    <!-- Movable Moving Light Sweep -->
    <circle r="160" fill="url(#lightSweep)" class="sweep-light" />
    <!-- Movable Moving Soft Shadow -->
    <circle r="140" fill="url(#darkSweep)" class="sweep-shade" />

    <!-- Rim Highlight -->
    <circle cx="450" cy="270" r="228" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6"/>
  </g>

  <!-- Movable Floating Tag Left: Full-Stack Dev -->
  <g class="anim-left">
    <rect x="0" y="0" width="138" height="36" class="tag-bg"/>
    <text x="69" y="23" text-anchor="middle" class="tag">Full-Stack Dev</text>
  </g>

  <!-- Movable Floating Tag Right: ML Explorer -->
  <g class="anim-right">
    <rect x="0" y="0" width="128" height="36" class="tag-bg"/>
    <text x="64" y="23" text-anchor="middle" class="tag">ML Explorer</text>
  </g>

  <!-- Movable Floating Tag Bottom: Open Source -->
  <g class="anim-bottom">
    <rect x="0" y="0" width="130" height="36" class="tag-bg"/>
    <text x="65" y="23" text-anchor="middle" class="tag">Open Source</text>
  </g>
</svg>
