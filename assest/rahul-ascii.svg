<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" width="100%" height="100%">
  <defs>
    <!-- Radial Glow for Light Sweep -->
    <radialGradient id="lightSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="darkSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Circular Clip Path for Portrait and Sweeps -->
    <clipPath id="circleClip">
      <circle cx="450" cy="270" r="230"/>
    </clipPath>

    <style>
      .bg {
        fill: #ffffff;
      }
      .ascii-text {
        font-family: 'SF Mono', 'JetBrains Mono', Consolas, Menlo, monospace;
        font-size: 5.2px;
        fill: #161616;
        white-space: pre;
        letter-spacing: 0px;
        user-select: none;
        -webkit-font-smoothing: none;
      }
      .tag {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #3a3a3a;
        letter-spacing: .2px;
      }
      .tag-bg {
        fill: #f0f0f0;
        stroke: #e2e2e2;
        stroke-width: 1;
        rx: 18;
        ry: 18;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
      }

      /* Smooth Floating Keyframe Animations */
      .anim-left {
        animation: floatL 4.2s ease-in-out infinite;
      }
      .anim-right {
        animation: floatR 4.8s ease-in-out infinite;
      }
      .anim-bottom {
        animation: floatB 3.9s ease-in-out infinite;
      }
      .sweep-light {
        animation: sweepMotion 6s ease-in-out infinite alternate;
      }
      .sweep-shade {
        animation: shadeMotion 6s ease-in-out infinite alternate;
      }

      @keyframes floatL {
        0%, 100% { transform: translate(55px, 305px); }
        50% { transform: translate(55px, 292px); }
      }
      @keyframes floatR {
        0%, 100% { transform: translate(730px, 215px); }
        50% { transform: translate(730px, 227px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(395px, 515px); }
        50% { transform: translate(395px, 506px); }
      }
      @keyframes sweepMotion {
        0% { transform: translate(320px, 170px); }
        50% { transform: translate(560px, 340px); }
        100% { transform: translate(360px, 380px); }
      }
      @keyframes shadeMotion {
        0% { transform: translate(560px, 340px); }
        50% { transform: translate(340px, 180px); }
        100% { transform: translate(540px, 200px); }
      }
    </style>
  </defs>

  <!-- Pure White Background -->
  <rect width="100%" height="100%" class="bg" />

