<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" width="100%" height="100%">
  <defs>
    <style>
      .bg {
        fill: #ffffff;
      }
      .ascii-text {
        font-family: 'SF Mono', 'JetBrains Mono', Consolas, Menlo, monospace;
        font-size: 5.2px;
        fill: #0070f3;
        white-space: pre;
        letter-spacing: 0px;
        -webkit-font-smoothing: none;
      }
      .tag {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #0056b3;
      }
      .tag-bg {
        fill: #f0f7ff;
        stroke: #b8d5ff;
        stroke-width: 1.5;
        rx: 18;
        ry: 18;
        filter: drop-shadow(0 2px 5px rgba(0, 112, 243, 0.15));
      }
      @media (prefers-color-scheme: dark) {
        .bg {
          fill: #0d1117;
        }
        .ascii-text {
          fill: #388bfd;
        }
        .tag-bg {
          fill: #161b22;
          stroke: #388bfd;
          filter: drop-shadow(0 2px 8px rgba(56, 139, 253, 0.25));
        }
        .tag {
          fill: #79c0ff;
        }
      }
    </style>
  </defs>
