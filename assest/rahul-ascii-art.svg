    <!-- MOVABLE LIGHT SWEEP (SMIL Animation: Works in <img> on GitHub) -->
    <circle r="180" fill="url(#lightGlow)">
      <animateTransform attributeName="transform" type="translate"
        values="300,160; 600,340; 380,400; 300,160"
        dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- MOVABLE SOFT SHADE -->
    <circle r="150" fill="url(#darkShade)">
      <animateTransform attributeName="transform" type="translate"
        values="600,340; 320,180; 550,220; 600,340"
        dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Circular Rim Border -->
    <circle cx="450" cy="270" r="228" fill="none" stroke="#f0f0f0" stroke-width="4"/>
  </g>

  <!-- MOVABLE FLOATING TAG LEFT: Full-Stack Dev -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="55,305; 55,291; 55,305"
      dur="3.8s" repeatCount="indefinite" />
    <rect x="0" y="0" width="140" height="38" class="tag-box"/>
    <text x="70" y="24" text-anchor="middle" class="tag-label">Full-Stack Dev</text>
  </g>

  <!-- MOVABLE FLOATING TAG RIGHT: ML Explorer -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="725,215; 725,229; 725,215"
      dur="4.4s" repeatCount="indefinite" />
    <rect x="0" y="0" width="132" height="38" class="tag-box"/>
    <text x="66" y="24" text-anchor="middle" class="tag-label">ML Explorer</text>
  </g>

  <!-- MOVABLE FLOATING TAG BOTTOM: Open Source -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="395,515; 395,503; 395,515"
      dur="3.4s" repeatCount="indefinite" />
    <rect x="0" y="0" width="130" height="38" class="tag-box"/>
    <text x="65" y="24" text-anchor="middle" class="tag-label">Open Source</text>
  </g>
</svg>
