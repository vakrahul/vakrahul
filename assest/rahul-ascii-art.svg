<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" width="100%" height="100%">
  <defs>
    <!-- Moving Radial Highlight for Light Sweep -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="darkShade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Circular Clip Path for Portrait -->
    <clipPath id="circleMask">
      <circle cx="450" cy="270" r="230"/>
    </clipPath>

    <style>
      .bg-rect {
        fill: #ffffff;
      }
      .ascii-code {
        font-family: 'SF Mono', 'JetBrains Mono', Consolas, Menlo, monospace;
        font-size: 5.2px;
        fill: #161616;
        white-space: pre;
        letter-spacing: 0px;
        user-select: none;
        -webkit-font-smoothing: none;
      }
      .tag-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #2a2a2a;
        letter-spacing: .2px;
      }
      .tag-box {
        fill: #f0f0f0;
        stroke: #e0e0e0;
        stroke-width: 1;
        rx: 18;
        ry: 18;
        filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.08));
      }
    </style>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" class="bg-rect" rx="16" />

